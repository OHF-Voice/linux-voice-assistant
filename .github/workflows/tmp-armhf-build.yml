---
name: Temp armhf build

# Temporary: builds Dockerfile.armhf on pushes to this branch. Remove before merging.
on:
  push:
    branches:
      - "pr-344-armv7l"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create version files
        run: |
          echo "tmp-armhf" > version.txt
          echo "${{ github.sha }}" > version_githash.txt
      - name: Build armhf image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.armhf
          platforms: linux/arm/v7
          push: false
          cache-from: type=gha,scope=build-armhf
          cache-to: type=gha,scope=build-armhf,mode=max
