---
name: Temp Docker build

# Temporary: builds both Docker images (no push) on pushes to this branch. Remove before merging.
on:
  push:
    branches:
      - "pr-344-armv7l"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            platforms: linux/amd64,linux/aarch64
            dockerfile: Dockerfile
          - suffix: "-armhf"
            platforms: linux/arm/v7
            dockerfile: Dockerfile.armhf
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create version files
        run: |
          echo "tmp-armhf" > version.txt
          echo "${{ github.sha }}" > version_githash.txt
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=build${{ matrix.suffix }}
          cache-to: type=gha,scope=build${{ matrix.suffix }},mode=max
