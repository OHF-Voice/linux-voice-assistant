---
name: Build main

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            platforms: linux/amd64,linux/aarch64
            dockerfile: Dockerfile
          - suffix: "-armhf"
            platforms: linux/arm/v7
            dockerfile: Dockerfile.armhf
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set lowercase registry and repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Build Docker Images (amd64 and arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Docker
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            suffix=${{ matrix.suffix }}
          images: ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}
          tags: |
            type=raw,value=nightly
          labels: |
            org.opencontainers.image.authors="Open Home Foundation"
            org.opencontainers.image.base.name="docker.io/library/python:3.13-slim-trixie"
            org.opencontainers.image.description="Linux-Voice-Assistant for Home Assistant"
            org.opencontainers.image.documentation="https://github.com/OHF-Voice/linux-voice-assistant/blob/main/README.md"
            org.opencontainers.image.licenses="Apache-2.0"
            org.opencontainers.image.source="https://github.com/OHF-Voice/linux-voice-assistant"
            org.opencontainers.image.title="Linux-Voice-Assistant"
            org.opencontainers.image.url="https://github.com/OHF-Voice/linux-voice-assistant"
            org.opencontainers.image.vendor="Open Home Foundation"

      - name: Create version files
        run: |
          echo "nightly" > version.txt
          echo "${{ github.sha }}" > version_githash.txt
          ls -ltr

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha,scope=build${{ matrix.suffix }}
          cache-to: type=gha,scope=build${{ matrix.suffix }},mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
