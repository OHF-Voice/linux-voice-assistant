---
# Standalone operation of the player outside the Home Assistant OS apps: a Linux host with Docker.
# The player runs as a regular user, started by the s6-overlay of the image. It reads the same SENDSPIN_* variables
# as docker-compose.build.yml, set them in the .env (see .env.example).
services:
  # Fix permissions for the state volume and the control socket directory, which are created owned by root
  fix-permissions:
    image: "${LOCAL_AUDIO_IMAGE:-ghcr.io/music-assistant/local-audio-addon}:${LOCAL_AUDIO_IMAGE_TAG:-latest}"
    entrypoint: []
    user: "0:0"
    command: "chown -R ${LOCAL_AUDIO_USER_ID:-1000}:${LOCAL_AUDIO_USER_GROUP:-1000} /data /run/sendspin-cli"
    volumes:
      - data:/data
      - ${LOCAL_AUDIO_CONTROL_DIR:-/run/sendspin-cli}:/run/sendspin-cli
    restart: "no"

  # Music Assistant Local Audio (Sendspin player)
  # The image starts s6-overlay, which starts the player. As a regular user the bundled dbus and avahi-daemon do not
  # start, but with the D-Bus socket of the host mounted (below) they are not needed: the player announces itself
  # through the Avahi of the host, which has to run on the host.
  local-audio:
    container_name: local-audio
    image: "${LOCAL_AUDIO_IMAGE:-ghcr.io/music-assistant/local-audio-addon}:${LOCAL_AUDIO_IMAGE_TAG:-latest}"
    restart: unless-stopped
    # The player announces itself through the Avahi of the host over the D-Bus socket below. On hosts with AppArmor
    # enabled (for example Ubuntu) the profile docker-default stops that ("could not register _sendspin._tcp").
    security_opt:
      - apparmor=unconfined
    # mDNS discovery and the port 8928 that the server connects back to need the network of the host
    network_mode: "host"
    user: "${LOCAL_AUDIO_USER_ID:-1000}:${LOCAL_AUDIO_USER_GROUP:-1000}"
    environment:
      # The sound server of the host: its directory is mounted below at the same path, see LOCAL_AUDIO_PULSE_SERVER,
      # LOCAL_AUDIO_PULSE_COOKIE and PIPEWIRE_REMOTE in the .env
      - XDG_RUNTIME_DIR=${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-1000}}
      - PULSE_SERVER=${LOCAL_AUDIO_PULSE_SERVER:-unix:/run/user/${LOCAL_AUDIO_USER_ID:-1000}/pulse/native}
      - PULSE_COOKIE=${LOCAL_AUDIO_PULSE_COOKIE:-/run/user/${LOCAL_AUDIO_USER_ID:-1000}/pulse/cookie}
    # The SENDSPIN_* options of the player. An option that is not set keeps the default of the image.
    env_file: ${ENV_FILE:-.env}
    # ALSA devices, for SENDSPIN_OUTPUT=default or an ALSA device such as hw:1,0
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Identity, pairings and state
      - data:/data
      # Rendered configuration and control socket of the player. In the container the image always uses
      # /run/sendspin-cli; the directory on the host is LOCAL_AUDIO_CONTROL_DIR, as control.sock. The directory is
      # mounted, so that the socket is created again when the container restarts.
      - ${LOCAL_AUDIO_CONTROL_DIR:-/run/sendspin-cli}:/run/sendspin-cli
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      - ${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-1000}}:${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-1000}}
      # Avahi of the host
      - /var/run/dbus:/var/run/dbus:ro
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
    # The image names the player `Local Audio` when SENDSPIN_NAME is not set. Here it is named after the host instead:
    # with the network of the host the hostname in the container is the one of the host. Then the entrypoint of the
    # image (/init, s6-overlay) takes over. The $$ is Compose escaping, the shell sees a single $.
    entrypoint: ["/bin/sh", "-c", 'export SENDSPIN_NAME="$${SENDSPIN_NAME:-$$(hostname)}"; exec /init']
    # Health check for process. It runs in the container, where the image always keeps the control socket at
    # /run/sendspin-cli/control.sock, whatever LOCAL_AUDIO_CONTROL_DIR is on the host.
    healthcheck:
      test: ["CMD", "sendspin-cli", "status", "--control-socket", "/run/sendspin-cli/control.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  data: