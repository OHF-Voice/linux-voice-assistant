---
# Satellite 1 HAT Board – peripheral controller
#
# Runs alongside the linux-voice-assistant container.
# Connects to LVA's peripheral WebSocket API (port 6055), drives the
# 24-LED SK6812 ring and reads the four hardware buttons on the Satellite 1 HAT.
#
# IMPORTANT – read the hardware notes at the bottom of this file before
# starting the container for the first time. The LED ring needs a jumper wire
# on the HAT, and the buttons need SPI enabled on the host.

services:
  satellite1-peripheral:
    build: .
    image: lva/satellite1_hat_board:local
    container_name: satellite1_hat_board
    restart: unless-stopped

    # -----------------------------------------------------------------------
    # PWM + DMA access (required by rpi-ws281x for LED ring control)
    #
    # rpi-ws281x drives the SK6812 LEDs via hardware PWM (GPIO 12, channel 0)
    # and DMA.  This requires access to /dev/mem for DMA buffer allocation.
    # There is no narrower capability; privileged is the practical requirement
    # on Raspberry Pi OS when using PWM mode.
    # -----------------------------------------------------------------------
    privileged: true

    # -----------------------------------------------------------------------
    # Device access
    #
    # privileged: true already exposes every host device; these entries are
    # kept as documentation of what the controller actually uses.
    # -----------------------------------------------------------------------
    devices:
      # SPI link to the XMOS chip – the four buttons are read through it
      - /dev/spidev0.0:/dev/spidev0.0
      # Full physical memory map – needed by rpi-ws281x DMA engine
      - /dev/mem:/dev/mem
      # Video core mailbox – used by rpi-ws281x to allocate DMA buffers
      - /dev/vcio:/dev/vcio

    # -----------------------------------------------------------------------
    # Run as root inside the container.
    # rpi-ws281x's DMA allocator requires root access to /dev/mem and /dev/vcio.
    # Root can also open /dev/spidev0.0, so no group_add is needed
    # (the python:slim base image has no "gpio" or "spi" group to resolve).
    # -----------------------------------------------------------------------
    user: "0:0"

    # -----------------------------------------------------------------------
    # Environment variables
    # -----------------------------------------------------------------------
    environment:
      - PYTHONUNBUFFERED=1

    # -----------------------------------------------------------------------
    # Network
    #
    # Uses the host network so "localhost" resolves to the Pi itself and
    # the LVA container's port 6055 is directly reachable.
    # If LVA is on a different host, change --host below to its IP address
    # and remove network_mode: host.
    # -----------------------------------------------------------------------
    network_mode: host

    # -----------------------------------------------------------------------
    # Command-line arguments passed to Satellite1_HAT_Board.py
    # -----------------------------------------------------------------------
    command:
      - "--host"
      - "localhost"        # Change to LVA container IP if on a different host
      - "--port"
      - "6055"
      # DMA channel for the LED ring. Must not be one the kernel uses (see
      # hardware note 2). Channel 10, the rpi-ws281x default, freezes the ring
      # under audio load on the Pi Zero 2 W.
      - "--led-dma"
      - "14"
      # Uncomment for verbose logging during setup / troubleshooting:
      # - "--debug"

    # -----------------------------------------------------------------------
    # Health check – verifies the process is still running
    # (pgrep comes from the procps package installed in the Dockerfile)
    # -----------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "pgrep", "-f", "Satellite1_HAT_Board.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # -----------------------------------------------------------------------
    # Logging – keep last 10 MB across 3 rotated files
    # -----------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# =============================================================================
# HARDWARE NOTES – read before first run
# =============================================================================
#
# 1. LED RING WIRING (jumper required on the Raspberry Pi)
#    The HAT sends the LED ring data line to header pin 15 (BCM GPIO 22), which
#    has no PWM, PCM or SPI function, so rpi-ws281x cannot drive it. The HAT was
#    designed around an ESP32 core board that can drive any pin.
#
#    Solder or clip a jumper wire from header pin 15 to header pin 32
#    (BCM GPIO 12, PWM0). The controller then drives the ring from GPIO 12 and
#    leaves GPIO 22 as an input. Do not use GPIO 22 for anything else.
#    Without the jumper the ring stays dark (only the power LEDs light).
#
#    Reported working on a Satellite1 HAT 1.1 with a Pi Zero 2 W; other HAT
#    revisions have not been checked.
#
# 2. DMA CHANNEL
#    rpi-ws281x defaults to DMA channel 10, but the kernel dmaengine can also
#    use it (it is listed in the device-tree channel mask). The ring then
#    updates a few frames and freezes once audio is running. Pick a channel the
#    kernel is unlikely to allocate and pass it with --led-dma (above).
#    Check which channels the kernel manages:
#
#        od -An -tx1 /proc/device-tree/soc/dma-controller@7e007000/brcm,dma-channel-mask
#
#    On the Pi Zero 2 W this prints 0x7f35: channel 10 is managed by the
#    kernel; channel 14, the highest managed one, is allocated last and works.
#    Other Raspberry Pi models have not been checked.
#
# 3. BUTTONS ARE READ OVER SPI
#    The four buttons are NOT wired to Raspberry Pi GPIOs. They are read from
#    the XMOS XVF3800 over SPI (/dev/spidev0.0). Enable SPI on the host in
#    /boot/firmware/config.txt (or /boot/config.txt on older Raspberry Pi OS):
#
#        dtparam=spi=on
#
#    then reboot. Check that /dev/spidev0.0 exists. The mute button is a
#    latching switch handled by the XMOS itself, so it also mutes the
#    microphone in hardware.
#
# 4. PWM KERNEL OVERLAY AND ONBOARD AUDIO
#    rpi-ws281x drives GPIO 12 through the PWM block. The setup that was
#    reported working had these in config.txt:
#
#        dtoverlay=pwm,pin=12,func=4
#        # dtparam=audio=on    <- commented out, onboard audio disabled
#
#    Onboard audio shares PWM0 with GPIO 12. The Satellite 1 HAT has its own
#    audio path, so onboard audio is not needed. It has not been tested whether
#    the pwm overlay is strictly required.
#
# 5. SATELLITE 1 HAT AUDIO
#    The microphone array (XMOS XVF3800) enumerates as a standard USB audio
#    device; LVA picks it up automatically via soundcard.
#    If you use the HAT's line-out, add to config.txt:
#
#        dtoverlay=hifiberry-dac
#
# 6. MEMORY SPLIT (optional)
#    On Pi Zero 2 W, increase GPU memory to at least 64 MB so the VideoCore
#    mailbox has enough address space for the DMA allocator:
#
#        gpu_mem=64    (in /boot/firmware/config.txt)
#
# =============================================================================
