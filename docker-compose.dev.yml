---
services:
  # Fix permissions for the wake word, sound and configuration volumes
  fix-permissions:
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant}:${LVA_IMAGE_TAG:-nightly}"
    entrypoint: []
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /app/wakewords /app/configuration /app/sounds/custom"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    volumes:
      # Wakeword data and configuration
      - wakeword_downloaded:/app/wakewords/downloaded
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  # Bring the Python environment of the image up to the dependencies in the mounted pyproject.toml, so that a branch
  # with a new dependency runs without a new image. The environment lives in the volume venv, which Docker fills
  # from the image the first time. The image has no pip in its environment, so the pip of the image's Python installs
  # into it (--python). Packages without a wheel cannot be built here, the image has no compiler.
  # After a new image: docker volume rm <project>_venv, so that the environment is taken from the image again.
  venv:
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant-pr}:${LVA_IMAGE_TAG:-nightly}"
    entrypoint: []
    user: "0:0"
    working_dir: /app
    command: "pip --python /app/.venv/bin/python install --no-cache-dir --disable-pip-version-check /app"
    volumes:
      - venv:/app/.venv
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./setup.cfg:/app/setup.cfg:ro
      - ./linux_voice_assistant:/app/linux_voice_assistant:ro
      - ./version.txt:/app/version.txt:ro
      - ./version_githash.txt:/app/version_githash.txt:ro
    restart: "no"

  # Linux Voice Assistant
  linux-voice-assistant:
    container_name: linux-voice-assistant
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant-pr}:${LVA_IMAGE_TAG:-nightly}"
    restart: unless-stopped
    network_mode: "host"
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Wakeword data and configuration
      - wakeword_downloaded:/app/wakewords/downloaded
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      # /run/user/1000:/run/user/1000
      - ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}:${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      # Control socket of a Sendspin player, see SENDSPIN_CONTROL_DIR in .env. The directory is mounted at the same path, not the
      # socket, so that the player can create the socket again when it restarts.
      - ${SENDSPIN_CONTROL_DIR:-/run/sendspin-cli/socket}:${SENDSPIN_CONTROL_DIR:-/run/sendspin-cli/socket}
      # Python environment, see the service venv
      - venv:/app/.venv
      # Mount source code for development
      - ./linux_voice_assistant:/app/linux_voice_assistant
      - ./sounds:/app/sounds
      - ./wakewords/internal:/app/wakewords/internal
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./script:/app/script
      - ./version.txt:/app/version.txt
      - ./version_githash.txt:/app/version_githash.txt
    depends_on:
      fix-permissions:
        condition: service_completed_successfully
      venv:
        condition: service_completed_successfully
    # Health check for process
    healthcheck:
      test: ["CMD", "pgrep", "-f", "linux_voice_assistant"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    command:
    #  - "--mic-noise-suppression"
    #  - "1"
    #  - --additional-parameters-here
    #  - --but-use-env-if-possible


volumes:
  wakeword_downloaded:
  wakeword_custom:
  configuration:
  sounds_custom:
  venv:
