---
# Local Audio (Sendspin player), used by the services with the profile "local-audio" below.
# The variables of the .env of docs/docker/local-audio that are set there (the others are optional and described in
# its .env.example), with their defaults. The user is the one of LVA. Set them in the .env or in the shell.
x-local-audio-environment: &local-audio-environment
  LOCAL_AUDIO_USER_ID: ${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}
  LOCAL_AUDIO_USER_GROUP: ${LOCAL_AUDIO_USER_GROUP:-${LVA_USER_GROUP:-1000}}
  # pulse, pulse:<sink>, pipewire, pipewire:<node>, default, hw:1,0 or null
  SENDSPIN_OUTPUT: "pulse"
  LOCAL_AUDIO_XDG_RUNTIME_DIR: ${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}
  LOCAL_AUDIO_PULSE_SERVER: ${LOCAL_AUDIO_PULSE_SERVER:-unix:${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}/pulse/native}
  LOCAL_AUDIO_PULSE_COOKIE: ${LOCAL_AUDIO_PULSE_COOKIE:-${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}/pulse/cookie}
  # "true" lets every server play without pairing, anything else requires pairing
  SENDSPIN_ALLOW_UNPAIRED: "true"

services:
  # Fix permissions for wakeword_data and configuration volume
  fix-permissions:
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant}:${LVA_IMAGE_TAG:-nightly}"
    entrypoint: []
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /app/local /app/configuration /app/wakewords/custom /app/sounds/custom"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    volumes:
      # Wakeword data and configuration
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  # Linux Voice Assistant
  linux-voice-assistant:
    container_name: linux-voice-assistant
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant-pr}:${LVA_IMAGE_TAG:-nightly}"
    restart: unless-stopped
    network_mode: "host"
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Wakeword data and configuration
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      # /run/user/1000:/run/user/1000
      - ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}:${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      # Mount source code for development
      - ./linux_voice_assistant:/app/linux_voice_assistant
      - ./sounds:/app/sounds
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./script:/app/script
      - ./version.txt:/app/version.txt
      - ./version_githash.txt:/app/version_githash.txt
      # Control socket of a Sendspin player, see SENDSPIN_CONTROL_DIR in .env. The directory is mounted at the same
      # path, not the socket, so that the player can create the socket again when it restarts.
      - ${SENDSPIN_CONTROL_DIR:-/run/sendspin-cli}:${SENDSPIN_CONTROL_DIR:-/run/sendspin-cli}
    depends_on:
      - fix-permissions
    # Health check for process
    healthcheck:
      test: ["CMD", "pgrep", "-f", "linux_voice_assistant"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    command:
    #  - "--mic-noise-suppression"
    #  - "1"
    #  - --additional-parameters-here
    #  - --but-use-env-if-possible

  # ---------------------------------------------------------------------------------------------------
  # Music Assistant Local Audio (Sendspin player), for testing the Sendspin bridge, the same project as
  # docs/docker/local-audio. Started only with `docker compose -f docker-compose.dev.yml --profile local-audio up`,
  # so that it does not collide with a player that already runs on the machine (port 8928, /run/sendspin-cli).
  # The directory of the control socket on the host is LOCAL_AUDIO_CONTROL_DIR, it has to be the same as the
  # SENDSPIN_CONTROL_DIR that linux-voice-assistant mounts (both default to /run/sendspin-cli).
  # The options of the player (SENDSPIN_*) and the settings of the project (LOCAL_AUDIO_*) are described in
  # docs/docker/local-audio/.env.example.
  # ---------------------------------------------------------------------------------------------------

  # Fix permissions for the state volume and the control socket directory, which are created owned by root
  fix-permissions-local-audio:
    image: "${LOCAL_AUDIO_IMAGE:-ghcr.io/music-assistant/local-audio-addon}:${LOCAL_AUDIO_IMAGE_TAG:-latest}"
    entrypoint: []
    user: "0:0"
    command: "chown -R ${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}:${LOCAL_AUDIO_USER_GROUP:-${LVA_USER_GROUP:-1000}} /data /run/sendspin-cli"
    volumes:
      - local_audio_data:/data
      - ${LOCAL_AUDIO_CONTROL_DIR:-/run/sendspin-cli}:/run/sendspin-cli
    restart: "no"
    profiles: ["local-audio"]

  # Music Assistant Local Audio (Sendspin player)
  # The image starts s6-overlay, which starts the player. As a regular user the bundled dbus and avahi-daemon do not
  # start, but with the D-Bus socket of the host mounted (below) they are not needed: the player announces itself
  # through the Avahi of the host, which has to run on the host.
  local-audio:
    image: "${LOCAL_AUDIO_IMAGE:-ghcr.io/music-assistant/local-audio-addon}:${LOCAL_AUDIO_IMAGE_TAG:-latest}"
    restart: unless-stopped
    profiles: ["local-audio"]
    # The player announces itself through the Avahi of the host over the D-Bus socket below. On hosts with AppArmor
    # enabled (for example Ubuntu) the profile docker-default stops that ("could not register _sendspin._tcp").
    security_opt:
      - apparmor=unconfined
    # mDNS discovery and the port 8928 that the server connects back to need the network of the host
    network_mode: "host"
    user: "${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}:${LOCAL_AUDIO_USER_GROUP:-${LVA_USER_GROUP:-1000}}"
    environment:
      <<: *local-audio-environment
      # The sound server of the host: its directory is mounted below at the same path, see LOCAL_AUDIO_PULSE_SERVER,
      # LOCAL_AUDIO_PULSE_COOKIE and PIPEWIRE_REMOTE in the .env
      XDG_RUNTIME_DIR: ${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}
      PULSE_SERVER: ${LOCAL_AUDIO_PULSE_SERVER:-unix:${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}/pulse/native}
      PULSE_COOKIE: ${LOCAL_AUDIO_PULSE_COOKIE:-${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}/pulse/cookie}
    # The other SENDSPIN_* options of the player. An option that is not set keeps the default of the image.
    env_file: ${ENV_FILE:-.env}
    # ALSA devices, for SENDSPIN_OUTPUT=default or an ALSA device such as hw:1,0
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Identity, pairings and state
      - local_audio_data:/data
      # Rendered configuration and control socket of the player. In the container the image always uses
      # /run/sendspin-cli; the directory on the host is LOCAL_AUDIO_CONTROL_DIR, as control.sock. The directory is
      # mounted, so that the socket is created again when the container restarts.
      - ${LOCAL_AUDIO_CONTROL_DIR:-/run/sendspin-cli}:/run/sendspin-cli
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      - ${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}:${LOCAL_AUDIO_XDG_RUNTIME_DIR:-/run/user/${LOCAL_AUDIO_USER_ID:-${LVA_USER_ID:-1000}}}
      # Avahi of the host
      - /var/run/dbus:/var/run/dbus:ro
    depends_on:
      fix-permissions-local-audio:
        condition: service_completed_successfully
    # The image names the player `Local Audio` when SENDSPIN_NAME is not set. Here it is named after the host instead:
    # with the network of the host the hostname in the container is the one of the host. Then the entrypoint of the
    # image (/init, s6-overlay) takes over. The $$ is Compose escaping, the shell sees a single $.
    entrypoint: ["/bin/sh", "-c", 'export SENDSPIN_NAME="$${SENDSPIN_NAME:-$$(hostname)}"; exec /init']
    # Health check for process. It runs in the container, where the image always keeps the control socket at
    # /run/sendspin-cli/control.sock, whatever LOCAL_AUDIO_CONTROL_DIR is on the host.
    healthcheck:
      test: ["CMD", "sendspin-cli", "status", "--control-socket", "/run/sendspin-cli/control.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom:
  local_audio_data:
