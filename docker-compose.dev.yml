---
# Local Audio (Sendspin player), used by the services with the profile "local-audio" below.
# What it shares with LVA is taken from the variables of LVA: LVA_USER_ID, LVA_USER_GROUP, LVA_XDG_RUNTIME_DIR,
# LVA_PULSE_SERVER, LVA_SENDSPIN_CONTROL_DIR and CLIENT_NAME (the name in Music Assistant). The rest is declared here,
# an empty value leaves an option unset. Set them in the .env or in the shell.
x-local-audio-image: &local-audio-image "${LOCAL_AUDIO_IMAGE:-ghcr.io/music-assistant/local-audio-addon}:${LOCAL_AUDIO_IMAGE_TAG:-latest}"
x-local-audio-environment: &local-audio-environment
  # Pulseaudio, the socket needs the prefix "unix:" here
  XDG_RUNTIME_DIR: ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
  PULSE_SERVER: unix:${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
  # Name in Music Assistant, unset: the name of the host
  LOCAL_AUDIO_NAME: ${CLIENT_NAME:-}
  # Port that the server connects to, unset: 8928
  LOCAL_AUDIO_PORT: ${LOCAL_AUDIO_PORT:-}
  # pulse, pulse:<sink>, pipewire, pipewire:<node>, default, hw:1,0 or null
  LOCAL_AUDIO_OUTPUT: ${LOCAL_AUDIO_OUTPUT:-pulse}
  # none, error, warn, info, debug, verbose
  LOCAL_AUDIO_LOG_LEVEL: ${LOCAL_AUDIO_LOG_LEVEL:-info}
  # 10 to 2000 milliseconds, and <codec>:<rate>:<depth>:<channels>, for example flac:48000:24:2
  LOCAL_AUDIO_BUFFER_MS: ${LOCAL_AUDIO_BUFFER_MS:-}
  LOCAL_AUDIO_AUDIO_FORMAT: ${LOCAL_AUDIO_AUDIO_FORMAT:-}
  # Dial out to a server instead of announcing over mDNS: <host>[:<port>], a ws:// URL or mdns:<name>
  LOCAL_AUDIO_SERVER: ${LOCAL_AUDIO_SERVER:-}
  # sendspin-cli 0.4 and later: "true" lets every server play without pairing. Up to 0.3.x: a fixed player id
  LOCAL_AUDIO_ALLOW_UNPAIRED: ${LOCAL_AUDIO_ALLOW_UNPAIRED:-}
  LOCAL_AUDIO_ID: ${LOCAL_AUDIO_ID:-}
  # Shell commands that run when a stream starts and stops
  LOCAL_AUDIO_HOOK_START: ${LOCAL_AUDIO_HOOK_START:-}
  LOCAL_AUDIO_HOOK_STOP: ${LOCAL_AUDIO_HOOK_STOP:-}

services:
  # Fix permissions for wakeword_data and configuration volume
  fix-permissions:
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant}:${LVA_IMAGE_TAG:-nightly}"
    entrypoint: []
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /app/local /app/configuration /app/wakewords/custom /app/sounds/custom"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    volumes:
      # Wakeword data and configuration
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  # Linux Voice Assistant
  linux-voice-assistant:
    container_name: linux-voice-assistant
    image: "${LVA_IMAGE:-ghcr.io/ohf-voice/linux-voice-assistant-pr}:${LVA_IMAGE_TAG:-nightly}"
    restart: unless-stopped
    network_mode: "host"
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    environment:
      # Pulseaudio
      - XDG_RUNTIME_DIR=${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
    env_file: ${ENV_FILE:-.env}
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Wakeword data and configuration
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      # /run/user/1000:/run/user/1000
      - ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}:${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      # Mount source code for development
      - ./linux_voice_assistant:/app/linux_voice_assistant
      - ./sounds:/app/sounds
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./script:/app/script
      - ./version.txt:/app/version.txt
      - ./version_githash.txt:/app/version_githash.txt
      # Control socket of a Sendspin player, see SENDSPIN_CONTROL_SOCKET in .env. The directory is mounted, not the
      # socket, so that the player can create the socket again when it restarts.
      - ${LVA_SENDSPIN_CONTROL_DIR:-/run/local-audio}:/sendspin
    depends_on:
      - fix-permissions
    # Health check for process
    healthcheck:
      test: ["CMD", "pgrep", "-f", "linux_voice_assistant"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    command:
    #  - "--mic-noise-suppression"
    #  - "1"
    #  - --additional-parameters-here
    #  - --but-use-env-if-possible

  # ---------------------------------------------------------------------------------------------------
  # Music Assistant Local Audio (Sendspin player), for testing --sendspin-control-socket.
  # Started only with `docker compose -f docker-compose.dev.yml --profile local-audio up`, so that it does not
  # collide with a player that already runs on the machine (container name, port 8928, /run/local-audio).
  # It uses the variables of LVA (user, audio socket, control socket directory), see the block at the top.
  # ---------------------------------------------------------------------------------------------------

  # Fix permissions for the state volume, which is created owned by root
  fix-permissions-local-audio:
    image: *local-audio-image
    entrypoint: []
    user: "0:0"
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /data /control"
    volumes:
      - local_audio_data:/data
      - ${LVA_SENDSPIN_CONTROL_DIR:-/run/local-audio}:/control
    restart: "no"
    profiles: ["local-audio"]

  # The image starts s6-overlay with its own dbus and avahi-daemon. The entrypoint is replaced here,
  # so only sendspin-cli runs. It announces itself through the Avahi of the host (D-Bus socket below).
  local-audio:
    container_name: ${LOCAL_AUDIO_CONTAINER_NAME:-local-audio}
    image: *local-audio-image
    restart: unless-stopped
    profiles: ["local-audio"]
    # The player announces itself through the Avahi of the host over the D-Bus socket below. On hosts with AppArmor
    # enabled (for example Ubuntu) the profile docker-default stops that ("could not register _sendspin._tcp").
    security_opt:
      - apparmor=unconfined
    # mDNS discovery and the port 8928 that the server connects back to need the network of the host
    network_mode: "host"
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    environment: *local-audio-environment
    group_add:
      - audio
    # Priority for audio process
    cap_add:
      - SYS_NICE
    volumes:
      # Identity, pairings and rendered configuration
      - local_audio_data:/data
      # Control socket of the player: on the host <directory>/control.sock, the directory that linux-voice-assistant mounts to /sendspin
      - ${LVA_SENDSPIN_CONTROL_DIR:-/run/local-audio}:/control
      # Time and zone
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # Pulseaudio
      - ${LVA_XDG_RUNTIME_DIR:-/run/user/1000}:${LVA_XDG_RUNTIME_DIR:-/run/user/1000}
      # Avahi of the host
      - /var/run/dbus:/var/run/dbus:ro
    depends_on:
      fix-permissions-local-audio:
        condition: service_completed_successfully
    # What /etc/s6-overlay/s6-rc.d/sendspin-cli/run of the image does, without s6-overlay: only options
    # that have a value are written, because a key that is present counts (an empty `server` would
    # turn the mDNS advertisement off). `id` and `allow-unpaired` are each only known to one generation
    # of the player, so they are written only when they are set. The `$$` is Compose escaping, the shell sees a single `$`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        conf=/data/sendspin-cli.conf
        mkdir -p /data/state
        rm -f /control/control.sock
        umask 077
        {
          printf 'output = %s\n' "$${LOCAL_AUDIO_OUTPUT:-pulse}"
          printf 'log-level = %s\n' "$${LOCAL_AUDIO_LOG_LEVEL:-info}"
          printf 'manufacturer = Music Assistant\n'
          printf 'product-name = Local Audio\n'
          [ -z "$${LOCAL_AUDIO_PORT:-}" ] || printf 'port = %s\n' "$$LOCAL_AUDIO_PORT"
          [ -z "$${LOCAL_AUDIO_NAME:-}" ] || printf 'name = %s\n' "$$LOCAL_AUDIO_NAME"
          [ -z "$${LOCAL_AUDIO_SERVER:-}" ] || printf 'server = %s\n' "$$LOCAL_AUDIO_SERVER"
          [ -z "$${LOCAL_AUDIO_BUFFER_MS:-}" ] || printf 'buffer-ms = %s\n' "$$LOCAL_AUDIO_BUFFER_MS"
          [ -z "$${LOCAL_AUDIO_AUDIO_FORMAT:-}" ] || printf 'audio-format = %s\n' "$$LOCAL_AUDIO_AUDIO_FORMAT"
          [ -z "$${LOCAL_AUDIO_ID:-}" ] || printf 'id = %s\n' "$$LOCAL_AUDIO_ID"
          [ "$${LOCAL_AUDIO_ALLOW_UNPAIRED:-}" != true ] || printf 'allow-unpaired = true\n'
          [ -z "$${LOCAL_AUDIO_HOOK_START:-}" ] || printf 'hook-start = %s\n' "$$LOCAL_AUDIO_HOOK_START"
          [ -z "$${LOCAL_AUDIO_HOOK_STOP:-}" ] || printf 'hook-stop = %s\n' "$$LOCAL_AUDIO_HOOK_STOP"
        } > "$$conf"
        exec sendspin-cli --config "$$conf" --state-dir /data/state --control-socket /control/control.sock
    # Health check for process
    healthcheck:
      test: ["CMD", "sendspin-cli", "status", "--control-socket", "/control/control.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom:
  local_audio_data:
