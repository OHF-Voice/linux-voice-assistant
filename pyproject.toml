[build-system]
requires = ["setuptools>=62.3", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name        = "linux-voice-assistant"
license     = {text = "Apache-2.0"}
description = "Linux voice assistant for Home Assistant using the ESPHome protocol"
readme      = "README.md"
authors     = [
    {name = "The Home Assistant Authors", email = "hello@home-assistant.io"}
]
keywords    = ["home", "assistant", "voice", "esphome", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11.0"
dependencies = [
    "aioesphomeapi==45.3.1",
    "netifaces2==0.0.22",
    "soundcard<1",
    "numpy>=2,<3",
    "pymicro-wakeword>=2,<3",
    "pyopen-wakeword>=1,<2",
    "python-mpv>=1,<2",
    "zeroconf<1",
    "getmac<1",
    "types-protobuf",
    "websockets==12",
    "webrtc-noise-gain>=1,<2",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "prek",
    "pytest-asyncio",
]

[project.scripts]
linux-voice-assistant = "linux_voice_assistant.__main__:run"

[project.urls]
"Source Code" = "http://github.com/OHF-Voice/linux-voice-assistant"

[tool.setuptools]
platforms = ["any"]
zip-safe  = true
include-package-data = true

[tool.setuptools.packages.find]
include = ["linux_voice_assistant", "linux_voice_assistant.*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 200
target-version = "py312"
extend-exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "B"]
ignore = [
  "PLR0904",  # too-many-public-methods
  "PLR0911",  # too-many-return-statements
  "PLR0912",  # too-many-branches
  "PLR0913",  # too-many-arguments
  "PLR0914",  # too-many-locals
  "PLR0915",  # too-many-statements
  "PLR0916",  # too-many-boolean-expressions
  "PLR0917",  # too-many-positional
  "PLR1702",  # too-many-nested-blocks
  "PLW0603",  # global-statement
  "PLW2901",  # redefined-loop-name (broad-except adjacent noise)
  "PLC0415",  # import-outside-top-level
  "PLR2004",  # magic-value-comparison (pylint doesn't flag this by default; kept off to match prior behavior)
  "PLW0642",  # self/cls reassignment noise
  "E501",     # line-too-long, handled by formatter/line-length instead
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"